services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookops}
      POSTGRES_USER: ${POSTGRES_USER:-bookops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookops_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookops} -d ${POSTGRES_DB:-bookops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/khalifamohammad/bookops-ai-api:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/khalifamohammad/bookops-ai-api:latest
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.worker"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    image: ghcr.io/khalifamohammad/bookops-ai-frontend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api

  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
